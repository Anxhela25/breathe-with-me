# Render Blueprint: the backend on Render's free plan, for presenting the project.
# Steps are in README.md, "Put it online for a presentation".
services:
  - type: web
    name: breathe-with-me-api
    runtime: python
    plan: free
    region: frankfurt  # closest to Albania; create the Neon database in Frankfurt too
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # migrations first, so the tables always match the code
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL  # from Neon, asked for when the Blueprint is created
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["capacitor://localhost","http://localhost:5173"]'
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BREVO_API_KEY  # Render blocks Gmail's SMTP on the free plan, so emails go through Brevo
        sync: false
      - key: BREVO_SENDER
        sync: false
